<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olivia — Starting...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding-top: 36px;
      /* space for titlebar */
    }

    .waiting-card {
      text-align: center;
      max-width: 420px;
      padding: 32px;
    }

    .waiting-card h1 {
      font-size: 20px;
      font-weight: 600;
      color: #d4a72c;
      margin-bottom: 8px;
    }

    .waiting-card .status {
      font-size: 14px;
      color: #8b949e;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .waiting-card .reason {
      font-size: 12px;
      color: #6e7681;
      margin-bottom: 24px;
      background: #161b22;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #21262d;
      word-break: break-all;
    }

    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #21262d;
      border-top-color: #d4a72c;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .retry-btn {
      display: inline-block;
      padding: 10px 24px;
      background: #d4a72c;
      color: #0d1117;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      text-decoration: none;
    }

    .retry-btn:hover {
      background: #e5b933;
    }

    .help-text {
      margin-top: 16px;
      font-size: 11px;
      color: #6e7681;
    }

    .help-text code {
      background: #161b22;
      border: 1px solid #21262d;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <div class="waiting-card">
    <div class="spinner" id="spinner"></div>
    <h1>Olivia</h1>
    <p class="status" id="status">Connecting to Olivia server...</p>
    <p class="reason" id="reason"></p>
    <button class="retry-btn" id="retryBtn" onclick="retry()">Retry Connection</button>
    <p class="help-text">
      If the server is not running, open a terminal and run:<br>
      <code>./runtime/start-all.sh</code>
    </p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const port = params.get('port') || '3229';
    const reason = params.get('reason') || '';
    const APP_URL = 'http://localhost:' + port + '/olivia/';
    const HEALTH_URL = 'http://127.0.0.1:' + port + '/api/health';

    document.getElementById('reason').textContent = reason || '';

    function retry() {
      document.getElementById('spinner').style.display = 'inline-block';
      document.getElementById('status').textContent = 'Connecting to Olivia server...';
      document.getElementById('retryBtn').disabled = true;

      fetch(HEALTH_URL, { signal: AbortSignal.timeout(5000) })
        .then(r => {
          if (r.ok) {
            document.getElementById('status').textContent = 'Server found! Loading OliviaLegal...';
            window.location.href = APP_URL;
          } else {
            showError('Server responded with status ' + r.status);
          }
        })
        .catch(err => {
          showError('Server not reachable on port ' + port + ' — ' + (err.message || 'connection refused'));
        });
    }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').textContent = msg;
      document.getElementById('reason').textContent = '';
      document.getElementById('retryBtn').disabled = false;
    }

    // Auto-retry on load
    retry();

    // Poll every 3 seconds silently
    let pollCount = 0;
    const pollInterval = setInterval(() => {
      if (pollCount >= 20) { clearInterval(pollInterval); return; }
      pollCount++;
      fetch(HEALTH_URL, { signal: AbortSignal.timeout(3000) })
        .then(r => {
          if (r.ok) {
            document.getElementById('status').textContent = 'Server found! Loading OliviaLegal...';
            window.location.href = APP_URL;
            clearInterval(pollInterval);
          }
        })
        .catch(() => { });
    }, 3000);
  </script>
</body>

</html>
