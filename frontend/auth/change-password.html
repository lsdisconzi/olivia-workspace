<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__PAGE_TITLE__</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #191917;
      --bg-card: #1f1f1d;
      --border: #2a2a28;
      --border-hi: #363634;
      --amber: #c4622d;
      --amber-lo: rgba(196, 98, 45, 0.12);
      --green: #4a9e70;
      --green-lo: rgba(74, 158, 112, 0.10);
      --blue: #4A7C9B;
      --blue-lo: rgba(74, 124, 155, 0.10);
      --white: #ede8df;
      --gray: #6b6b68;
      --gray-hi: #9a9a96;
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Plus Jakarta Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --r: 10px;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--white);
      font-family: var(--sans);
      line-height: 1.7;
      font-size: 15px;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 440px;
    }

    /* Brand */
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-brand-name {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 500;
      color: var(--white);
      letter-spacing: -0.01em;
      margin-bottom: 2px;
    }

    .login-brand-name em {
      font-style: italic;
      font-weight: 400;
    }

    .login-brand-sub {
      font-family: var(--sans);
      font-size: 10px;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* Card */
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 32px;
    }

    .card-title {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 400;
      color: var(--white);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .card-user {
      font-size: 13px;
      color: var(--gray);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .card-user strong {
      color: var(--amber);
      font-weight: 600;
    }

    /* Hint */
    .notice {
      padding: 10px 14px;
      border: 1px solid rgba(196, 98, 45, 0.25);
      border-radius: 8px;
      background: var(--amber-lo);
      font-size: 12px;
      color: var(--gray-hi);
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .notice i {
      color: var(--amber);
      margin-right: 6px;
    }

    /* Error */
    .error-msg {
      border: 1px solid rgba(158, 74, 74, 0.3);
      background: rgba(158, 74, 74, 0.08);
      border-radius: 8px;
      padding: 10px 14px;
      color: #9e4a4a;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      line-height: 1.5;
    }

    /* Fields */
    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 10px;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
      font-family: var(--sans);
    }

    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-hi);
      border-radius: 8px;
      color: var(--white);
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 14px;
      letter-spacing: 0.08em;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
    }

    input:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-lo);
    }

    /* Submit button */
    .btn-submit {
      width: 100%;
      border: none;
      border-radius: 8px;
      background: var(--white);
      color: #191917;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      padding: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 2px;
    }

    .btn-submit:hover {
      background: #f5f0e8;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      transform: none;
      cursor: not-allowed;
    }

    .login-meta {
      margin-top: 18px;
      text-align: center;
      font-size: 11px;
      color: var(--gray);
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="login-brand">
      <div class="login-brand-name">Olivia <em>×</em> <span style="color:var(--amber);">Governança</span></div>
      <div class="login-brand-sub">Segurança · Atualização de senha</div>
    </div>

    <div class="login-card">
      <h2 class="card-title">Atualize sua senha</h2>
      <p class="card-user">Por segurança, atualize sua senha para continuar.<br>Usuário:
        <strong>__USER_DISPLAY__</strong>
      </p>

      <div class="notice">
        <i class="fas fa-shield-alt"></i>
        Use no mínimo __MIN_LENGTH__ caracteres e escolha uma senha diferente da atual.
      </div>
      __ERROR_HTML__

      <form method="POST" action="__FORM_ACTION__" id="changePasswordForm">
        <input type="hidden" name="next" value="__NEXT__">

        <div class="field">
          <label for="current_code">Senha atual</label>
          <input id="current_code" name="current_code" type="password" autocomplete="current-password" required
            placeholder="••••••••">
        </div>
        <div class="field">
          <label for="new_code">Nova senha</label>
          <input id="new_code" name="new_code" type="password" autocomplete="new-password" required
            placeholder="••••••••">
        </div>
        <div class="field">
          <label for="confirm_code">Confirmar nova senha</label>
          <input id="confirm_code" name="confirm_code" type="password" autocomplete="new-password" required
            placeholder="••••••••">
        </div>

        <button class="btn-submit" type="submit">
          <i class="fas fa-key"></i> Salvar nova senha
        </button>
      </form>

      <div class="login-meta">Olivia · Segurança</div>
    </div>
  </div>

  <script>
    document.getElementById('changePasswordForm').addEventListener('submit', function () {
      const btn = this.querySelector('button[type="submit"]');
      if (!btn) return;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Atualizando...';
    });
  </script>
  <script src="/olivia/auth-activity/tracker.js"></script>
</body>

</html>
