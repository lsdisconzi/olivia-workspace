:root{
    --white:#FAF6EF;         /* linen page background */
    --paper:#FFFFFF;         /* crisp card surface */
    --cream:#F2ECDE;         /* deeper tinted panel */
    --black:#34302A;         /* soft ink — primary text */

    --green-dark:#3F6152;    /* sage-deep — headings, filled buttons */
    --green-mid:#7FA98E;     /* sage — accents, lines, icons */
    --green-light:#A9CBB7;   /* pale sage — tints */

    --amber:#D98A5E;         /* soft terracotta — kickers, CTAs */
    --amber-light:#E7A67D;   /* peach — hovers */
    --golden:#D6B87A;        /* pale gold — tertiary accent */

    --gray:#ADA396;          /* tertiary text */
    --gray-hi:#6B6458;       /* secondary text */

    --color-text-primary:var(--black);
    --color-text-secondary:var(--gray-hi);
    --color-text-tertiary:var(--gray);
    --color-border-light:rgba(63,97,82,.12);
    --color-border-medium:rgba(63,97,82,.20);
    --color-border-strong:rgba(63,97,82,.30);

    --font-serif:'Fraunces',Georgia,serif;
    --font-sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --transition:.35s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    font-family:var(--font-sans);
    background:var(--white);
    color:var(--black);
    line-height:1.65;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Rail ── */
.rail{position:fixed;left:20px;top:0;bottom:0;width:1px;z-index:5;pointer-events:none}
.rail::before{
    content:'';position:absolute;left:0;top:64px;bottom:64px;width:1px;
    background:linear-gradient(var(--green-mid),var(--color-border-light) 40%,var(--color-border-light) 60%,var(--amber));
    opacity:.4;
}
.rail .dot{position:absolute;left:-2.5px;width:6px;height:6px;border-radius:50%}
.rail .dot.top{top:60px;background:var(--green-mid)}
.rail .dot.bottom{bottom:60px;background:var(--amber)}
@media (max-width:900px){.rail{display:none}}

/* ── Nav ── */
nav{
    position:fixed;top:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:1.2rem 2.6rem;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    background:color-mix(in srgb, var(--white) 80%, transparent);
    border-bottom:1px solid transparent;
    transition:border-color var(--transition);
}
nav.scrolled{border-bottom-color:var(--color-border-light)}
.logo{display:flex;align-items:baseline;gap:.5rem;font-family:var(--font-serif);font-size:1.22rem;font-weight:500;color:var(--green-dark);letter-spacing:-0.01em}
.logo .tag{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.16em;color:var(--gray);text-transform:uppercase;font-weight:400}
.nav-links{display:flex;align-items:center;gap:1.9rem}
.nav-links a{font-size:.82rem;color:var(--color-text-secondary);transition:color var(--transition);font-weight:500}

}

/* ── Hero ── */

.morph-scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .85s ease,transform .85s ease;transform:scale(.94);pointer-events:none}

.morph-label{font-family:var(--font-serif);font-size:1.65rem;font-weight:400;color:var(--color-text-primary);margin-top:.5rem;transition:opacity .35s;letter-spacing:-0.01em}
.morph-sub{font-family:var(--font-sans);font-size:.88rem;color:var(--color-text-tertiary);max-width:460px;line-height:1.6;min-height:42px;margin-top:.4rem;transition:opacity .35s}

<!-- ═══ HISTORY ═══ -->
<section class="quiet reveal" id="history">
    <div class="kicker">History</div>
    <h2>It began as a series of <em>questions</em>.</h2>
    <p class="lede">The earliest conversations centred on a narrow legal tool. But the real problem was far larger: every industry holds immense operational knowledge inside its people, yet almost none of it ever becomes software — because the people who hold it aren't programmers, and the software they're offered forces them to adapt to someone else's idea of how their work should be done.</p>
    <p class="lede">The turning point was recognising that organisations don't need another single-purpose application. They need an <strong style="color:var(--green-dark)">environment</strong> where their own expertise can meet AI — one that produces tools, workflows, and automations that fit their real daily routines. The legal-specific logic was stripped away. What remained was a clean canvas, already wired with the ability to think, learn, and build alongside the people who use it.</p>
</section>

    <h2>Democratise the creation of AI-powered <em>capability</em>.</h2>
    <p class="lede">We exist so that every business, charity, team, and individual worker can translate their operational expertise into practical, AI-assisted systems — without having to become software engineers.</p>
    <ul class="principle-list">
        <li><span class="n">01</span><span><strong>Adapts to the organisation</strong>, not the other way around — learning from the people who know the work best.</span></li>
        <li><span class="n">02</span><span><strong>Turns knowledge into working software</strong>, with domain experts collaborating directly with AI agents.</span></li>
        <li><span class="n">03</span><span><strong>Enables learning while building</strong> — every interaction builds both capability and skill.</span></li>
        <li><span class="n">04</span><span><strong>Unites the organisation</strong> in one living ecosystem, turning isolated efforts into shared intelligence.</span></li>
        <li><span class="n">05</span><span><strong>Grows with the people who use it</strong> — never limited to predefined features.</span></li>
        <li><span class="n">06</span><span><strong>Keeps people at the centre</strong> — AI accelerates implementation, people provide context, judgment, and priorities.</span></li>

<script>
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 12), { passive: true });

document.querySelectorAll('.reveal').forEach(el => {
    new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: .1 }).observe(el);
});

const meta = {
    tree: { label: 'Olivia', sub: 'The trunk and its first branches — the same shape that grows into every venue in the network.' },
    table: { label: 'Every venue, its own shape', sub: 'Kitchen, bar, front desk — Olivia sits inside each one and learns how that team actually works.' },
    network: { label: 'One connected network', sub: 'Glasgow to St Andrews — five operators, one living workspace where every team\u2019s learning strengthens the whole group.' }
};

function morph(id) {
    document.querySelectorAll('.morph-scene').forEach(s => s.classList.remove('active'));
    const sceneEl = document.getElementById('scene-' + id);
    if (sceneEl) sceneEl.classList.add('active');
    document.querySelectorAll('.pills .pill').forEach(p => p.classList.remove('active'));
    const pillEl = document.querySelector(".pills .pill[onclick*='" + id + "']");
    if (pillEl) pillEl.classList.add('active');
    const m = meta[id] || meta.tree;
    const lbl = document.getElementById('morphLabel');
    const sub = document.getElementById('morphSub');
    if (!lbl || !sub) return;
    lbl.style.opacity = '0'; sub.style.opacity = '0';
    setTimeout(() => { lbl.textContent = m.label; sub.textContent = m.sub; lbl.style.opacity = '1'; sub.style.opacity = '1'; }, 220);
}

const dashData = {
    sales: { rev: '£4,280', cov: '94', gp: '63.7%', var: '-1.2%', revPct: 78, covPct: 65, gpPct: 63, varPct: 12 },

    pnl:   { rev: '£4,550', cov: '102', gp: '65.1%', var: '-0.7%', revPct: 83, covPct: 71, gpPct: 65, varPct: 7 }
};

function updateDash() {
    const slider = document.getElementById('dateSlider'); if (!slider) return;
    const val = parseInt(slider.value);
    document.getElementById('dateVal').textContent = val + ' Jul';
    const active = document.querySelector('.wb-pill-sm.active')?.id;
    const view = active === 'dashStock' ? 'stock' : active === 'dashPnl' ? 'pnl' : 'sales';
    applyDash(view);
}

function setDashView(view, btn) {
    document.querySelectorAll('.wb-pill-sm').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    applyDash(view);
}

function applyDash(view) {
    const d = dashData[view];
    document.getElementById('dashRev').textContent = d.rev;
    document.getElementById('dashCov').textContent = d.cov;
    document.getElementById('dashGP').textContent = d.gp;
    document.getElementById('dashVar').textContent = d.var;
    const fills = document.querySelectorAll('.dash-bar-fill');
    if (fills.length >= 4) {
        fills[0].style.width = d.revPct + '%';
        fills[1].style.width = d.covPct + '%';
        fills[2].style.width = d.gpPct + '%';
        fills[3].style.width = d.varPct + '%';
    }
}

function opPreset(preset, btn) {
    const scene = document.getElementById('shaderScene'); if (!scene) return;
    const bars = scene.querySelectorAll('.shader-bar');
    document.querySelectorAll('.shader-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    scene.classList.remove('night', 'rain', 'fog', 'winter', 'sunset');
    const heights = {
        day:    [100,160,130,180,110,150,140],
        sunset: [140,190,160,200,150,180,170],
        night:  [40,60,35,55,30,50,45],
        rain:   [50,70,45,65,40,60,55],
        fog:    [30,40,25,35,20,45,38],
        winter: [160,200,180,210,170,195,190]
    };
    const h = heights[preset] || heights.day;
    bars.forEach((bar, i) => { bar.style.height = h[i] + 'px'; });
    if (['sunset','night','rain','fog','winter'].includes(preset)) scene.classList.add(preset);
}
