<head>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
    /* ═══════════════════════════════════════════
           OLIVIA WORKSPACE AGENT · BRANDED THEME
           ═══════════════════════════════════════════ */
    [data-theme="dark"] {
      --bg: #191917;
      --bg-card: #1f1f1d;
      --bg-card-hover: #252523;
      --border: #2a2a28;
      --border-medium: #363634;
      --border-strong: #444442;
      --amber: #D98A5E;
      --amber-light: #E7A67D;
      --amber-lo: rgba(217, 138, 94, .12);
      --amber-bg: rgba(217, 138, 94, .06);
      --green-dark: #7FA98E;
      --green-mid: #A9CBB7;
      --green-light: #C5DDCE;
      --green-lo: rgba(127, 169, 142, .10);
      --green-bg: rgba(127, 169, 142, .05);
      --blue: #7AAFC5;
      --blue-light: #9CC5D6;
      --blue-lo: rgba(122, 175, 197, .10);
      --blue-bg: rgba(122, 175, 197, .05);
      --golden: #D6B87A;
      --white: #ede8df;
      --gray: #6b6b68;
      --gray-hi: #9a9a96;
      --cream: #242422;
      --brand-text: var(--white);
      --btn-bg: #ede8df;
      --btn-text: #191917;
      --btn-hover-bg: #d6d0c6;
      --input-bg: #191917;
      --input-border: #363634;
      --shadow: 0 6px 24px rgba(0, 0, 0, .22);
      --shadow-hover: 0 14px 36px rgba(0, 0, 0, .30);
      --notif-unread-bg: rgba(217, 138, 94, .08);
      --notif-unread-border: rgba(217, 138, 94, .25);
      --footer-border: #2a2a28;
      --rail-opacity: .28;
      --body-glow-1: rgba(214, 184, 122, .03);
      --body-glow-2: rgba(217, 138, 94, .02);
      --kicker-bg: #242422;
      --kicker-border: #2a2a28;
      --icon-verde-border: rgba(127, 169, 142, .20);
      --icon-verde-bg: rgba(127, 169, 142, .08);
      --icon-terra-border: rgba(217, 138, 94, .20);
      --icon-terra-bg: rgba(217, 138, 94, .08);
      --icon-azul-border: rgba(122, 175, 197, .18);
      --icon-azul-bg: rgba(122, 175, 197, .06);
    }

    [data-theme="light"] {
      --bg: #FAF6EF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #fdfdfb;
      --border: rgba(63, 97, 82, .10);
      --border-medium: rgba(63, 97, 82, .18);
      --border-strong: rgba(63, 97, 82, .28);
      --amber: #D98A5E;
      --amber-light: #E7A67D;
      --amber-lo: rgba(217, 138, 94, .08);
      --amber-bg: rgba(217, 138, 94, .05);
      --green-dark: #3F6152;
      --green-mid: #7FA98E;
      --green-light: #A9CBB7;
      --green-lo: rgba(127, 169, 142, .08);
      --green-bg: rgba(127, 169, 142, .05);
      --blue: #5A8DA6;
      --blue-light: #7AAFC5;
      --blue-lo: rgba(90, 141, 166, .08);
      --blue-bg: rgba(90, 141, 166, .05);
      --golden: #D6B87A;
      --white: #34302A;
      --gray: #ADA396;
      --gray-hi: #6B6458;
      --cream: #F2ECDE;
      --brand-text: var(--green-dark);
      --btn-bg: #3F6152;
      --btn-text: #FAF6EF;
      --btn-hover-bg: #345545;
      --input-bg: #FFFFFF;
      --input-border: rgba(63, 97, 82, .18);
      --shadow: 0 6px 24px rgba(63, 97, 82, .05);
      --shadow-hover: 0 14px 36px rgba(63, 97, 82, .10);
      --notif-unread-bg: rgba(217, 138, 94, .06);
      --notif-unread-border: rgba(217, 138, 94, .22);
      --footer-border: rgba(63, 97, 82, .10);
      --rail-opacity: .35;
      --body-glow-1: rgba(214, 184, 122, .04);
      --body-glow-2: rgba(217, 138, 94, .03);
      --kicker-bg: #F2ECDE;
      --kicker-border: rgba(63, 97, 82, .08);
      --icon-verde-border: rgba(127, 169, 142, .22);
      --icon-verde-bg: rgba(127, 169, 142, .06);
      --icon-terra-border: rgba(217, 138, 94, .22);
      --icon-terra-bg: rgba(217, 138, 94, .06);
      --icon-azul-border: rgba(90, 141, 166, .18);
      --icon-azul-bg: rgba(90, 141, 166, .05);
    }

    :root {
      --bg: #191917;
      --bg-card: #1f1f1d;
      --bg-card-hover: #252523;
      --border: #2a2a28;
      --border-medium: #363634;
      --border-strong: #444442;
      --amber: #D98A5E;
      --amber-light: #E7A67D;
      --amber-lo: rgba(217, 138, 94, .12);
      --amber-bg: rgba(217, 138, 94, .06);
      --green-dark: #7FA98E;
      --green-mid: #A9CBB7;
      --green-light: #C5DDCE;
      --green-lo: rgba(127, 169, 142, .10);
      --green-bg: rgba(127, 169, 142, .05);
      --blue: #7AAFC5;
      --blue-light: #9CC5D6;
      --blue-lo: rgba(122, 175, 197, .10);
      --blue-bg: rgba(122, 175, 197, .05);
      --golden: #D6B87A;
      --white: #ede8df;
      --gray: #6b6b68;
      --gray-hi: #9a9a96;
      --cream: #242422;
      --brand-text: var(--white);
      --btn-bg: #ede8df;
      --btn-text: #191917;
      --btn-hover-bg: #d6d0c6;
      --input-bg: #191917;
      --input-border: #363634;
      --shadow: 0 6px 24px rgba(0, 0, 0, .22);
      --shadow-hover: 0 14px 36px rgba(0, 0, 0, .30);
      --notif-unread-bg: rgba(217, 138, 94, .08);
      --notif-unread-border: rgba(217, 138, 94, .25);
      --footer-border: #2a2a28;
      --rail-opacity: .28;
      --body-glow-1: rgba(214, 184, 122, .03);
      --body-glow-2: rgba(217, 138, 94, .02);
      --kicker-bg: #242422;
      --kicker-border: #2a2a28;
      --icon-verde-border: rgba(127, 169, 142, .20);
      --icon-verde-bg: rgba(127, 169, 142, .08);
      --icon-terra-border: rgba(217, 138, 94, .20);
      --icon-terra-bg: rgba(217, 138, 94, .08);
      --icon-azul-border: rgba(122, 175, 197, .18);
      --icon-azul-bg: rgba(122, 175, 197, .06);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background .35s ease, color .35s ease;
    }

    /* ─── TOP BAR ─── */
    .topo {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 52px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 16px;
      box-shadow: var(--shadow);
    }

    .marca {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .marca-nome {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 16px;
      font-weight: 500;
      color: var(--green-dark);
      letter-spacing: -0.01em;
      text-decoration: none;
    }

    .marca-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--amber);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .topo-nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .nav-tab {
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 500;
      color: var(--gray);
      border-radius: 6px;
      transition: all .15s;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .nav-tab:hover {
      color: var(--amber);
      background: var(--amber-lo);
    }

    .nav-tab.ativo {
      color: var(--amber);
      background: var(--amber-lo);
      font-weight: 600;
    }

    .topo-direita {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tag-versao {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--gray);
      padding: 3px 8px;
      border: 1px solid var(--border-medium);
      border-radius: 4px;
    }

    .topo-sair {
      font-size: 11px;
      color: var(--gray);
      text-decoration: none;
      transition: color .15s;
    }

    .topo-sair:hover {
      color: var(--amber);
    }

    /* ─── HAMBURGER ─── */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      padding: 6px;
      background: none;
      border: none;
      z-index: 200;
    }

    .hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--white);
      border-radius: 2px;
      transition: all .25s;
    }

    .hamburger.open span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }

    .hamburger.open span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.open span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    .mobile-drawer {
      display: none;
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px 16px;
      z-index: 99;
      flex-direction: column;
      box-shadow: var(--shadow);
    }

    .mobile-drawer.open {
      display: flex;
    }

    .mobile-drawer a {
      display: block;
      padding: 11px 0;
      font-size: 14px;
      color: var(--gray-hi);
      text-decoration: none;
      border-bottom: 1px solid var(--cream);
    }

    .mobile-drawer a:last-child {
      border: none;
    }

    /* ─── LAYOUT ─── */
    .agent-page {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 52px);
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 0 20px;
    }

    .context-bar {
      display: flex;
      gap: 6px;
      padding: 14px 0 10px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .context-bar::-webkit-scrollbar {
      display: none;
    }

    .ctx-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid var(--border-medium);
      border-radius: 999px;
      background: var(--bg-card);
      font-size: 10px;
      font-weight: 500;
      color: var(--gray-hi);
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
      flex-shrink: 0;
    }

    .ctx-chip:hover {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-lo);
    }

    .ctx-chip i {
      font-size: 10px;
      opacity: .6;
    }

    /* ─── CHAT ─── */
    .chat-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .chat-head {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: var(--bg-card);
    }

    .chat-head-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-head-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--gray);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green-mid);
      flex-shrink: 0;
    }

    .status-dot.thinking {
      background: var(--amber);
      animation: dotPulse 1.2s infinite;
    }

    @keyframes dotPulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .4;
      }
    }

    .chat-head-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chat-head-btn {
      background: none;
      border: none;
      padding: 5px 7px;
      color: var(--gray);
      cursor: pointer;
      font-size: 11px;
      transition: color .15s;
      border-radius: 4px;
    }

    .chat-head-btn:hover {
      color: var(--amber);
      background: var(--amber-lo);
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      background: var(--cream);
    }

    /* ─── BUBBLES ─── */
    .chat-bubble {
      max-width: 85%;
      font-size: 14px;
      line-height: 1.7;
      color: var(--white);
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: 16px 16px 4px 16px;
      padding: 10px 14px;
      color: var(--white);
    }

    .chat-bubble.agent {
      align-self: flex-start;
      padding: 0;
    }

    .agent-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .agent-card.streaming {
      border-color: var(--amber);
    }

    .agent-card-body {
      padding: 14px 16px;
      color: var(--white);
    }

    .agent-card-body p {
      margin: 0 0 8px;
      font-size: 14px;
      line-height: 1.7;
    }

    .agent-card-body strong {
      color: var(--green-dark);
      font-weight: 600;
    }

    .agent-card-body a {
      color: var(--amber);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .agent-card-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: var(--cream);
      padding: 1px 5px;
      border-radius: 3px;
      color: var(--green-dark);
    }

    .agent-card-body ul,
    .agent-card-body ol {
      margin: 6px 0 10px 20px;
    }

    .agent-card-body li {
      margin: 0 0 4px;
      font-size: 13px;
      line-height: 1.6;
    }

    .agent-card-body h3 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--green-dark);
      margin: 14px 0 6px;
      line-height: 1.3;
    }

    .agent-card-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }

    .detail-block {
      border-top: 1px solid var(--border);
    }

    .detail-block summary {
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--gray);
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all .15s;
    }

    .detail-block summary::-webkit-details-marker {
      display: none;
    }

    .detail-block summary::before {
      content: '';
      width: 5px;
      height: 5px;
      border-right: 1.5px solid var(--gray);
      border-bottom: 1.5px solid var(--gray);
      transform: rotate(-45deg);
      transition: transform .2s;
    }

    .detail-block[open] summary::before {
      transform: rotate(45deg);
    }

    .detail-block summary:hover {
      background: var(--cream);
      color: var(--amber);
    }

    .detail-block-body {
      padding: 10px 16px 14px;
      font-size: 13px;
      line-height: 1.65;
      color: var(--gray-hi);
      border-top: 1px solid var(--border);
      background: var(--cream);
    }

    .agent-table-wrap {
      overflow-x: auto;
      margin: 8px 0;
    }

    .agent-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .agent-table th {
      padding: 7px 10px;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--gray);
      background: var(--cream);
      border-bottom: 1px solid var(--border);
    }

    .agent-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--white);
    }

    .action-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--cream);
    }

    .action-btn {
      border: 1px solid var(--border-medium);
      background: var(--bg-card);
      color: var(--gray-hi);
      border-radius: 999px;
      padding: 5px 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .action-btn:hover {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-lo);
    }

    .proc-line {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      color: var(--gray-hi);
      font-size: 13px;
    }

    .proc-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-medium);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: procSpin 1s linear infinite;
    }

    @keyframes procSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .chat-compose {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: var(--bg-card);
    }

    .compose-wrap {
      flex: 1;
      position: relative;
    }

    .compose-wrap textarea {
      width: 100%;
      padding: 10px 12px;
      padding-right: 50px;
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      color: var(--white);
      background: var(--input-bg);
      outline: none;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      transition: border-color .2s;
      line-height: 1.5;
    }

    .compose-wrap textarea:focus {
      border-color: var(--amber);
    }

    .compose-count {
      position: absolute;
      right: 8px;
      bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--gray);
      pointer-events: none;
    }

    .send-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--amber);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }

    .send-btn:hover {
      background: var(--amber-light);
    }

    .send-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .bottom-bar {
      flex-shrink: 0;
      padding: 8px 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tool-btn {
      background: none;
      border: 1px solid transparent;
      padding: 4px 8px;
      font-size: 11px;
      color: var(--gray);
      cursor: pointer;
      border-radius: 4px;
      transition: all .15s;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .tool-btn:hover {
      color: var(--amber);
      border-color: var(--border-medium);
      background: var(--amber-lo);
    }

    .bottom-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--gray);
    }

    /* History panel */
    .history-panel {
      position: fixed;
      right: 20px;
      bottom: 78px;

  <script>
    // ─── Page-level i18n bootstrap for the Agent Mobile page ───
    // Stays in sync with the main workspace language (localStorage 'olivia_workspace_lang',
    // the same key index.html uses). Translations live in /olivia/languages/pages/agent.<lang>.json.
    (function () {
      var STORAGE_KEY = 'olivia_workspace_lang';
      // JSON file base name per supported language code.
      var FILES = {
        en: 'english', pt: 'portuguese', es: 'spanish', fr: 'french', de: 'german',
        it: 'italian', el: 'greek', pl: 'polish', sq: 'albanian', cs: 'czech', th: 'thai'
      };
      // Map a browser/HTML lang tag (e.g. pt-BR) to our two-letter code.
      function normLang(raw) {
        if (!raw) return null;
        var code = String(raw).slice(0, 2).toLowerCase();
        return FILES[code] ? code : null;
      }
      function detectLang() {
        try {
          var params = new URLSearchParams(window.location.search);
          var q = params.get('lang');
          if (q && FILES[q]) return q;
        } catch (e) {}
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          if (saved && FILES[saved]) return saved;
        } catch (e) {}
        var fromHtml = normLang(document.documentElement.getAttribute('lang'));
        if (fromHtml) return fromHtml;
        var nav = normLang((navigator.language || 'pt'));
        return nav || 'pt';
      }
      var LANG = detectLang();
      // Set <html lang> early so the page renders with the right locale attributes.
      document.documentElement.setAttribute('lang', LANG);

      function apply(dict) {
        if (!dict) return;
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) {
          var key = nodes[i].getAttribute('data-i18n');
          if (dict[key] != null && dict[key] !== '') nodes[i].textContent = dict[key];
        }
      }

      function loadAndApply() {
        var url = '/olivia/languages/pages/agent.' + FILES[LANG] + '.json';
        fetch(url, { cache: 'no-cache' })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(apply)
          .catch(function (err) { console.warn('[agent i18n] failed to load', url, err); });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadAndApply);
      } else {
        loadAndApply();
      }

      // Expose so in-page controls (and cross-links) can switch language.
      window.agentSetLang = function (code) {
        if (!FILES[code]) return;
        LANG = code;
        document.documentElement.setAttribute('lang', code);
        try { localStorage.setItem(STORAGE_KEY, code); } catch (e) {}
        loadAndApply();
      };
    })();
  </script>

<script>
    /* ── DRAWER ── */
    function toggleDrawer() { document.getElementById('mobileDrawer').classList.toggle('open'); document.getElementById('hamburger').classList.toggle('open') }
    function closeDrawer() { document.getElementById('mobileDrawer').classList.remove('open'); document.getElementById('hamburger').classList.remove('open') }

    /* ── OLIVIA WORKSPACE PRIMER ── */
    const WORKSPACE_PRIMER = [
      'Você é Olivia, a agente do Olivia Workspace — um ecossistema de IA que adapta software às pessoas.',
      'Conhece cada módulo do guia de funcionalidades: Core Runtime, Agents & Orchestration, Creativity & Studio, Data & Analysis, Legal & Compliance, Communication & Media, Connectors & Extensions, UI & Navigation.',
      'Domina os papéis reais: caixa, bartender, financeiro, compras, vendas, almoxarifado, compliance, RH, gerência, TI.',
      'Responda sempre em português do Brasil, com tom executivo e direto.',
      'Use exemplos concretos (ex: "o bartender usa Olivia para verificar estoque em uma sexta à noite", "o financeiro encontra uma discrepância de fatura com busca semântica").',
      'Se perguntado sobre um módulo, explique o que ele faz tecnicamente e como ele aparece no dia a dia.',
      'Mantenha respostas concisas, com bullets quando apropriado, e cite nomes de módulos (ex: Memory, Studio, Legal Router).',
      '--- Conhecimento completo do guia ---',
      'Visão: Olivia é um workspace inteligente que qualquer time pode moldar — ela aprende com as pessoas, não o contrário.',
      'Core Runtime: config.js (ambiente global), api-client.js (33+ funções HTTP/SSE), logger.js (debug interativo), core.js (inicialização), state.js/utils.js (utilitários).',
      'Agents: agents.js (criação, exportação .agent.md), agent-orchestration.js (roteamento por seção).',
      'Creativity: studio.js (editor HTML/CSS/JS), shaders.js (cenas SVG animadas), scene3d.js (modelos 3D), preview-recorder.js (gravação de tela).',
      'Data: memory.js (Qdrant + Neo4j, busca semântica), history.js (histórico de chat), discovery.js (pipeline NLP), docs.js (navegador de documentos), shared.js (recursos compartilhados).',
      'Legal: law_library.js (fontes jurídicas), legal-router.js (resolução de violações), violations.js (explorador de violações).',
      'Media: listening.js (transcrição de áudio), sheets.js (planilhas inteligentes), writer.js (editor Markdown).',
      'Conectores: drive.js (Google Drive), craudio.js (24 fluxos de litígio), meshy-ui.js (geração 3D).',
      'UI: tabs.js (sidebar), trunk.js (navegação por perfil), modals.js, fullscreen-controls.js, nav.js (mobile).',
      'Missão: democratizar a criação de capacidade com IA, unindo times e transformando expertise em ferramentas.',
      '---',
    ].join('\n');

    let workspaceContextSent = false;

    function _wrapWithWorkspacePrimer(message) {
      if (workspaceContextSent) return message;
      workspaceContextSent = true;
      return WORKSPACE_PRIMER + '\n' + message;
    }

    /* ── TOPIC PRESETS ── */
    const TOPIC_QUERIES = {
      ws_overview: 'Dê uma visão geral do Olivia Workspace: visão, módulos principais e para quem ele serve.',
      ws_roles: 'Explique como o Olivia Workspace atende diferentes funções: caixa, bartender, compras, financeiro, vendas, almoxarifado e compliance. Dê um exemplo real de cada.',
      ws_core: 'Descreva o módulo Core Runtime e como ele garante que o workspace funcione de forma consistente em qualquer dispositivo.',
      ws_agents: 'Como funcionam os agentes no Olivia? Fale sobre criação, exportação e roteamento por seção.',
      ws_studio: 'Quais ferramentas de criatividade o Olivia oferece? Dê exemplos de uso real (formulário de vendas, treinamento de bartender, preview 3D para cliente).',
      ws_data: 'Explique os recursos de dados e análise: memória vetorial, pipeline de descoberta, documentos compartilhados. Como um financeiro usa isso no fechamento mensal?',
      ws_legal: 'Quais são os módulos legais do Olivia? Como um oficial de compliance localiza rapidamente uma regulamentação ou um caso de violação?',
      ws_demo: 'Quero agendar uma demonstração. O que devo dizer sobre minha equipe e como o Olivia pode ajudar?',
    };

    function askTopic(key) {
      const prompt = TOPIC_QUERIES[key] || 'Fale sobre o Olivia Workspace.';
      sendAgentMessage({ message: prompt, model: 'deepseek-v4-flash', newSession: true });
    }

    /* ── STATE ── */
    const STORAGE_KEY = 'Olivia_agent_workspace_v1';
    const LOCAL_SAVED_KEY = 'Olivia_agent_saved_workspace_v1';
    const CLOVI_BASE_URL = (function () {
      const o = location.origin;
      if (/:3229(\/|$)/.test(location.host) || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        return o;
      }
      return o + '/api/OliviaLegal';
    })();
    let chatHistory = [];
    let sessionId = null;
    let savedConversationId = '';
    let hasUnsavedChanges = false;

    /* ── HELPERS ── */
    function _esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') }

    function _safeHref(raw) {
      const v = String(raw || '').trim();
      if (!v) return '';
      if (/^https?:\/\//i.test(v)) return v;
      if (/^\/(?:OliviaLegal|olivia)(?:\/|$)/i.test(v)) return `${location.origin}${v}`;
      return '';
    }

    function _linkifyBareTargets(html) {
      const parts = html.split(/(<a\b[^>]*>[\s\S]*?<\/a>)/gi);
      return parts.map(part => {
        if (/^<a\b/i.test(part)) return part;
        return part.replace(/(^|[\s(>])((?:https?:\/\/|\/(?:OliviaLegal|olivia)\/)[^\s<]+)/g, (m, prefix, target) => {
          let clean = target,
            trail = '';
          while (/[),.;!?]$/.test(clean)) {
            trail = clean.slice(-1) + trail;
            clean = clean.slice(0, -1)
          }
          const href = _safeHref(clean);
          if (!href) return m;
          return `${prefix}<a href="${href}" target="_blank" rel="noopener noreferrer">${clean}</a>${trail}`;
        });
      }).join('');
    }

    function _near(el, px) { if (!el) return true; return (el.scrollHeight - el.scrollTop - el.clientHeight) <= (px || 80) }

    function _bottom(el) { if (el) el.scrollTop = el.scrollHeight }

    function autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px'
    }

    function updateCount() {
      const i = document.getElementById('agentInput'),
      c = document.getElementById('charCount'); if (i && c) {
        const l = (i.value || '').length;
        c.textContent = l + '/1200';
        c.style.color = l > 1100 ? 'var(--amber)' : 'var(--gray)'
      }
    }

    /* ── FORMATTING ── */
    function _inline(text) {
      let html = _esc(text)
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) => {
          const href = _safeHref(url);
          if (!href) return `${label} (${url})`;
          return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        });
      html = _linkifyBareTargets(html);
      return html
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function _parseTable(section) {
      const lines = section.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length < 3 || !lines[0].includes('|')) return '';
      const sep = lines[1].replace(/[|:\-\s]/g, '');
      if (sep.length) return '';
      const cells = l => l.split('|').map(c => c.trim()).filter(Boolean);
      const head = cells(lines[0]),
        rows = lines.slice(2).map(cells).filter(r => r.length);
      if (!head.length || !rows.length) return '';
      return `<div class="agent-table-wrap"><table class="agent-table"><thead><tr>${head.map(h => `<th>${_inline(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${head.map((_, i) => `<td>${_inline(r[i] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }

    function renderBody(text) {
      const sections = String(text || '').split(/\n{2,}/);
      let html = '';
      for (const raw of sections) {
        const s = raw.trim();
        if (!s) continue;
        const table = _parseTable(s);
        if (table) { html += table; continue }
        if (s.startsWith('## ') || s.startsWith('### ')) {
          html +=
          `<h3>${_inline(s.replace(/^#{2,4}\s*/, '').trim())}</h3>`; continue
        }
        if (s.startsWith('- ')) {
          html +=
          `<ul>${s.split('\n').filter(l => l.trim().startsWith('- ')).map(l => `<li>${_inline(l.trim().slice(2))}</li>`).join('')}</ul>`; continue
        }
        if (/^\d+\.\s/.test(s)) {
          html +=
          `<ol>${s.split('\n').filter(l => /^\d+\.\s/.test(l.trim())).map(l => `<li>${_inline(l.trim().replace(/^\d+\.\s/, ''))}</li>`).join('')}</ol>`; continue
        }
        if (s === '---') { html += '<hr>'; continue }
        html += `<p>${_inline(s).replace(/\n/g, '<br>')}</p>`;
      }
      return html;
    }

    function buildCard(text, refs, meta, opts) {
      const o = opts || {};
      let c = '<div class="agent-card' + (o.streaming ? ' streaming' : '') + '">';
      c += '<div class="agent-card-body">' + renderBody(text) + '</div>';
      if (refs && refs.length) {
        c += '<details class="detail-block"><summary>Fontes consultadas (' + refs.length + ')</summary>';
        c += '<div class="detail-block-body">' + refs.map(r =>
          '<code style="font-size:11px;display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;background:var(--cream);border-radius:3px;color:var(--amber)">' +
          _esc(r) + '</code>').join('') + '</div></details>';
      }
      if (o.actions) {
        c += '<div class="action-bar">';
        c +=
          '<button class="action-btn" onclick="askFollowUp(\'detalhar\')"><i class="fas fa-search-plus"></i> Detalhar</button>';
        c +=
          '<button class="action-btn" onclick="askFollowUp(\'passos\')"><i class="fas fa-list-check"></i> Próximos passos</button>';
        c +=
          '<button class="action-btn" onclick="askFollowUp(\'riscos\')"><i class="fas fa-triangle-exclamation"></i> Riscos</button>';
        c +=
          '<button class="action-btn" onclick="askFollowUp(\'comparar\')"><i class="fas fa-arrows-left-right"></i> Comparar módulos</button>';
        c += '</div>';
      }
      c += '</div>';
      return c;
    }

    function askFollowUp(kind) {
      const p = {
        detalhar: 'Pode detalhar mais a resposta anterior, com exemplos práticos de uso no dia a dia?',
        passos: 'Quais seriam os próximos passos para uma equipe começar a usar o Olivia Workspace?',
        riscos: 'Quais são os principais riscos ou desafios na adoção do Olivia em um ambiente real?',
        comparar: 'Compare dois módulos que você mencionou e explique quando usar cada um.',
      };
      const prompt = p[kind] || 'Pode elaborar?';
      sendAgentMessage({ message: prompt, model: 'deepseek-v4-flash', newSession: true });
    }

    /* ── RENDER ── */
    function appendUser(text) {
      const log = document.getElementById('agentLog');
      const pin = _near(log);
      const div = document.createElement('div');
      div.className = 'chat-bubble user';
      div.innerHTML = `<p>${_esc(text)}</p>`;
      log.appendChild(div);
      if (pin) _bottom(log);
      chatHistory.push({ role: 'user', text, timestamp: new Date().toISOString() });
      hasUnsavedChanges = true;
    }

    function appendAgent(text, refs, meta, opts) {
      const o = opts || { actions: true };
      const log = document.getElementById('agentLog');
      const pin = _near(log);
      const div = document.createElement('div');
      div.className = 'chat-bubble agent';
      div.innerHTML = buildCard(text, refs, meta, o);
      log.appendChild(div);
      if (pin) _bottom(log);
      if (o.store !== false) {
        chatHistory.push({
          role: 'agent', text, references: refs || [], meta: meta || '',
          timestamp: new Date().toISOString()
        });
        hasUnsavedChanges = true;
      }
    }

    /* ── PROCESSING INDICATOR ── */
    const PROC_PHASES = ['Analisando a pergunta', 'Consultando o guia do Workspace', 'Conectando módulos',
      'Buscando exemplos reais', 'Estruturando resposta'
    ];

    function createProcessingIndicator() {
      const log = document.getElementById('agentLog');
      const pin = _near(log);
      const line = document.createElement('div');
      line.className = 'proc-line';
      line.id = 'procLine';
      const started = Date.now();
      let phaseIdx = 0;
      line.innerHTML =
        `<div class="proc-spinner"></div><span class="proc-text">${PROC_PHASES[0]}</span><span class="proc-elapsed">0s</span>`;
      log.appendChild(line);
      if (pin) _bottom(log);

      let thinkBuf = '';
      let entries = [];
      let contextFiles = [];

      const phaseTimer = setInterval(() => {
        phaseIdx++; const t = line.querySelector('.proc-text'); if (t) t
          .textContent = PROC_PHASES[phaseIdx % PROC_PHASES.length]
      }, 3500);
      const tickTimer = setInterval(() => {
        const e = line.querySelector('.proc-elapsed'); if (e) e.textContent =
          Math.floor((Date.now() - started) / 1000) + 's'
      }, 1000);

      return {
        setPhase(text) {
          if (text && text.length > 3) {
            const t = line.querySelector('.proc-text'); if (t) t
              .textContent = text.slice(0, 50)
          }
        },
        addThinking(content) {
          thinkBuf += content;
          if (thinkBuf.length > 30 && /[.!?\n]/.test(content)) {
            const clean = thinkBuf.replace(/\s+/g, ' ').trim();
            if (clean.length > 8) entries.push(clean.slice(0, 120));
            thinkBuf = '';
          }
        },
        addLog(text) { if (text && text.length > 2) entries.push(String(text).slice(0, 120)) },
        setFiles(files) {
          if (files && files.length) {
            contextFiles = files.map(f => f.path || f.name || f).filter(Boolean);
            entries.push(`${files.length} arquivo(s) carregado(s)`);
          }
        },
        getFiles() { return contextFiles },
        finalize() {
          clearInterval(phaseTimer);
          clearInterval(tickTimer);
          if (line.parentNode) line.parentNode.removeChild(line);
          if (thinkBuf.trim().length > 8) entries.push(thinkBuf.replace(/\s+/g, ' ').trim().slice(0, 120));
          if (entries.length > 0) {
            const elapsed = Math.floor((Date.now() - started) / 1000);
            const logDiv = document.createElement('div');
            logDiv.className = 'thought-log';
            let html =
              `<div class="thought-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">Pensamento do agente (${entries.length})<span class="tt-elapsed">${elapsed}s</span></div>`;
            html += '<div class="thought-items">';
            entries.forEach(e => {
              html +=
              `<div class="thought-item">${_esc(e)}</div>`
            });
            html += '</div>';
            logDiv.innerHTML = html;
            log.appendChild(logDiv);
          }
        },
      };
    }

    function createStreamBubble() {
      const log = document.getElementById('agentLog');
      let sticky = _near(log);
      const div = document.createElement('div');
      div.className = 'chat-bubble agent';
      div.innerHTML = buildCard('...', null, null, { streaming: true });
      log.appendChild(div);
      if (sticky) _bottom(log);
      let last = 0;
      return {
        set(t) {
          sticky = sticky && _near(log, 160);
          div.innerHTML = buildCard(t || '...', null, null, { streaming: true }); const n = Date.now(); if (n -
            last > 100) {
              if (sticky) _bottom(log);
            last = n
          }
        },
        finalize(t, r, m) {
          div.innerHTML = buildCard(t, r, m, { actions: true });
          _bottom(log);
          chatHistory.push({
            role: 'agent', text: t, references: r || [], meta: m || '',
            timestamp: new Date().toISOString()
          });
          hasUnsavedChanges = true
        },
        remove() { if (div.parentNode) div.parentNode.removeChild(div) }
      };
    }

    function setThinking(on) {
      const dot = document.getElementById('statusDot'),
        label = document.getElementById('statusLabel'),
        btn = document.getElementById('sendBtn');
      if (dot) dot.className = 'status-dot' + (on ? ' thinking' : '');
      if (label) label.textContent = on ? 'Processando' : 'Pronto';
      if (btn) {
        btn.disabled = on;
        btn.innerHTML = on ? '<i class="fas fa-spinner fa-spin" style="font-size:12px"></i>' :
          '<i class="fas fa-arrow-up" style="font-size:12px"></i>'
      }
    }

    /* ── PERSISTENCE ── */
    function _conversationTitleFromHistory() {
      const firstUser = chatHistory.find(item => item && item.role === 'user' && item.text);
      if (firstUser && firstUser.text) return String(firstUser.text).slice(0, 120);
      return `Conversa ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`;
    }

    function _renderAgentConversation(items) {
      const log = document.getElementById('agentLog');
      log.innerHTML = '';
      (items || []).forEach(item => {
        if (!item || !item.text) return;
        const role = item.role === 'assistant' ? 'agent' : item.role;
        const div = document.createElement('div');
        div.className = 'chat-bubble ' + (role === 'agent' ? 'agent' : 'user');
        if (role === 'agent') div.innerHTML = buildCard(item.text, item.references, item.meta, { actions: false });
        else div.innerHTML = `<p>${_esc(item.text)}</p>`;
        log.appendChild(div);
      });
      _bottom(log);
    }

    async function saveAgentChat(options) {
      const o = options || {};
      if (!chatHistory.length) {
        if (!o.silent) appendAgent('Não há conversa para salvar.', null, null, { actions: false, store: false });
        return false;
      }

      function readSavedSessions() {
        try {
          const raw = localStorage.getItem(LOCAL_SAVED_KEY); const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : []
        } catch (_) { return [] }
      }

      function writeSavedSessions(items) {
        try { localStorage.setItem(LOCAL_SAVED_KEY, JSON.stringify(items || [])) } catch (
        _) { }
      }

      const nowIso = new Date().toISOString();
      const currentId = savedConversationId || `local-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const entry = {
        id: currentId,
        title: _conversationTitleFromHistory(),
        updated_at: nowIso,
        message_count: chatHistory.length,
        last_message_preview: String((chatHistory[chatHistory.length - 1] || {}).text || '').slice(0, 180),
        messages: chatHistory,
      };
      const list = readSavedSessions().filter(item => String(item.id || '') !== currentId);
      list.unshift(entry);
      writeSavedSessions(list.slice(0, 80));
      savedConversationId = currentId;
      hasUnsavedChanges = false;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory)) } catch (_) { }
      if (!o.silent) appendAgent('Conversa salva no histórico local.', null, null, { actions: false, store: false });
      return true;
    }

    function loadSaved() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return false;
        const saved = JSON.parse(raw); if (!saved || !saved.length) return false;
        chatHistory = saved;
        _renderAgentConversation(chatHistory);
        hasUnsavedChanges = false; return true
      } catch (e) { return false }
    }

    async function clearAgentChat() {
      if (!chatHistory.length) return;
      if (hasUnsavedChanges) {
        const shouldSave = confirm('Conversa não salva. Deseja salvar antes de limpar?');
        if (shouldSave) { const ok = await saveAgentChat({ silent: true }); if (!ok) return }
      }
      if (!confirm('Limpar toda a conversa?')) return;
      localStorage.removeItem(STORAGE_KEY);
      chatHistory = [];
      sessionId = null;
      savedConversationId = '';
      hasUnsavedChanges = false;
      document.getElementById('agentLog').innerHTML = '';
      showWelcome();
    }

    async function openAgentHistory() {
      const panel = document.getElementById('agentHistoryPanel');
      const list = document.getElementById('agentHistoryList');
      if (!panel || !list) return;
      panel.classList.add('open');
      list.innerHTML = '<div class="history-empty">Carregando...</div>';
      try {
        const raw = localStorage.getItem(LOCAL_SAVED_KEY);
        const items = raw ? JSON.parse(raw) : [];
        const conversations = Array.isArray(items) ? items : [];
        if (!conversations.length) {
          list.innerHTML =
          '<div class="history-empty">Nenhuma conversa salva ainda.</div>'; return
        }
        list.innerHTML = conversations.map(item => {
          const id = String(item.id || '');
          const title = _esc(item.title || 'Conversa');
          const preview = _esc(item.last_message_preview || '');
          const updated = _esc(String(item.updated_at || '').replace('T', ' ').slice(0, 16));
          const count = Number(item.message_count || 0);
          return `<div class="history-item">
                <div class="history-item-title">${title}</div>
                <div class="history-item-preview">${preview || 'Sem preview'}</div>
                <div class="history-item-meta">${count} mensagem(ns) · ${updated}</div>
                <div class="history-item-actions">
                  <button class="history-btn" onclick="loadAgentConversation('${id}')">Abrir</button>
                  <button class="history-btn" onclick="deleteAgentConversation('${id}')">Excluir</button>
                </div>
              </div>`;
        }).join('');
      } catch (err) {
        list.innerHTML =
        `<div class="history-empty">Falha ao carregar: ${_esc(err.message || String(err))}</div>`
      }
    }

    function closeAgentHistory() { document.getElementById('agentHistoryPanel').classList.remove('open') }

    async function loadAgentConversation(conversationId) {
      if (!conversationId) return;
      try {
        const raw = localStorage.getItem(LOCAL_SAVED_KEY);
        const items = raw ? JSON.parse(raw) : [];
        const conversations = Array.isArray(items) ? items : [];
        const conversation = conversations.find(item => String(item.id || '') === String(conversationId || ''));
        if (!conversation) throw new Error('Conversa não encontrada.');
        chatHistory = Array.isArray(conversation.messages) ? conversation.messages : [];
        savedConversationId = String(conversation.id || '');
        sessionId = null;
        hasUnsavedChanges = false;
        _renderAgentConversation(chatHistory);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory)) } catch (_) { }
        closeAgentHistory();
      } catch (err) {
        appendAgent(`Falha ao abrir: ${err.message || err}`, null, null, {
          actions: false,
          store: false
        })
      }
    }

    async function deleteAgentConversation(conversationId) {
      if (!conversationId) return;
      if (!confirm('Excluir esta conversa salva?')) return;
      try {
        const raw = localStorage.getItem(LOCAL_SAVED_KEY);
        const items = raw ? JSON.parse(raw) : [];
        const conversations = Array.isArray(items) ? items : [];
        const filtered = conversations.filter(item => String(item.id || '') !== String(conversationId || ''));
        localStorage.setItem(LOCAL_SAVED_KEY, JSON.stringify(filtered));
        if (savedConversationId === conversationId) savedConversationId = '';
        openAgentHistory();
      } catch (err) {
        appendAgent(`Falha ao excluir: ${err.message || err}`, null, null, {
          actions: false,
          store: false
        })
      }
    }

    function downloadFile(n, c, m) {
      const b = new Blob([c], { type: m }),
      a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = n;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href)
    }

    function exportAgentChatTxt() {
      if (!chatHistory.length) return;
      const lines = chatHistory.map(i => `[${i.timestamp}] ${i.role.toUpperCase()}: ${i.text}`);
      downloadFile(`OliviaWorkspace-chat-${new Date().toISOString().slice(0, 10)}.txt`, lines.join('\n\n'),
        'text/plain;charset=utf-8');
    }

    function exportAgentChatJson() {
      if (!chatHistory.length) return;
      downloadFile(`OliviaWorkspace-chat-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(chatHistory, null,
        2), 'application/json;charset=utf-8');
    }

    /* ── WELCOME ── */
    function showWelcome() {
      appendAgent(
        'Olá! Sou **Olivia**, a agente do **Olivia Workspace**.\n\nConheço cada módulo do ecossistema — do Core Runtime ao Legal, passando por Criatividade, Dados e Conectores — e também os papéis reais: caixa, bartender, compras, financeiro, vendas, almoxarifado e compliance.\n\nPergunte o que quiser: "como o bartender usa o Olivia numa sexta à noite?", "o que o módulo Memory faz?", ou "quero uma demonstração".',
        null, null, { actions: false, store: false }
      );
    }

    /* ── SEND ── */
    async function sendAgentMessage(preset) {
      const presetObj = (preset && typeof preset === 'object') ? preset : null;
      const input = document.getElementById('agentInput');
      const message = ((presetObj ? presetObj.message : preset) || input.value || '').trim();
      const requestModel = presetObj && typeof presetObj.model === 'string' && presetObj.model.trim() ? presetObj.model
        .trim() : null;
      if (presetObj && presetObj.newSession) {
        sessionId = null;
        workspaceContextSent = false
      }
      if (!message) return;
      if (message.length > 1200) {
        appendAgent('Mensagem muito longa. Limite: 1200 caracteres.', null, null, {
          actions: false,
          store: false
        }); return
      }

      appendUser(message);
      if (!preset) {
        input.value = '';
        autoGrow(input);
        updateCount()
      }
      setThinking(true);
      const proc = createProcessingIndicator();

      try {
        const history = chatHistory.filter(i => i && i.text).slice(-20).map(i => ({
          role: i.role === 'agent' ?
            'assistant' : 'user', content: i.text
        }));
        const messageForBackend = _wrapWithWorkspacePrimer(message);
        const payload = { message: messageForBackend, history, session_id: sessionId || null };
        if (requestModel) payload.model = requestModel;
        const res = await fetch(`${CLOVI_BASE_URL}/api/assistant/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          let err = ''; try { err = await res.text() } catch (_) { }
          proc.finalize();
          appendAgent(`Erro ao consultar (${res.status}).${err ? '\n' + err : ''}`, null, null, {
            actions: false,
            store: false
          }); return
        }

        const reader = res.body && res.body.getReader ? res.body.getReader() : null;
        if (!reader) {
          proc.finalize();
          appendAgent('Streaming indisponível.', null, null, { actions: false, store: false }); return
        }

        const decoder = new TextDecoder('utf-8');
        let buffer = '',
          streamed = '',
          streamError = '',
          streamBubble = null;

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line.startsWith('data:')) continue;
            const json = line.slice(5).trim();
            if (!json) continue;
            let evt;
            try { evt = JSON.parse(json) } catch (_) { continue }

            if (evt.type === 'token' && typeof evt.content === 'string') {
              if (!streamBubble) {
                removeThinking();
                streamBubble = createStreamBubble()
              }
              streamed += evt.content;
              streamBubble.set(streamed);
            } else if (evt.type === 'agent_status') {
              proc.setPhase(evt.message || 'Executando');
              proc.addLog(evt.message || 'Executando');
            } else if (evt.type === 'thinking' && evt.content) {
              proc.addThinking(evt.content);
            } else if (evt.type === 'files_context' && Array.isArray(evt.files)) {
              proc.setFiles(evt.files);
            } else if (evt.type === 'session_id' && evt.session_id) {
              sessionId = evt.session_id;
            } else if (evt.type === 'error' || evt.event === 'error') {
              streamError = String(evt.message || 'Erro no stream');
            }
          }
        }

        const realFiles = proc.getFiles();
        proc.finalize();

        if (streamError) {
          if (streamBubble) streamBubble.remove();
          appendAgent(`Erro: ${streamError}`, null, null, { actions: false, store: false }); return
        }
        const refs = realFiles.length > 0 ? realFiles : null;
        if (streamBubble) {
          streamBubble.finalize(streamed || 'Sem resposta.', refs,
            'modo: OliviaWorkspace/project-aware')
        } else {
          appendAgent(streamed || 'Sem resposta.', refs,
            'modo: OliviaWorkspace/project-aware')
        }
      } catch (err) {
        proc.finalize();
        appendAgent(`Erro de rede: ${err.message || err}`, null, null, { actions: false, store: false });
      } finally {
        removeThinking();
        setThinking(false)
      }
    }

    function removeThinking() {
      const el = document.getElementById('procLine'); if (el && el.parentNode) el.parentNode
        .removeChild(el)
    }

    /* ── INIT ── */
    document.addEventListener('DOMContentLoaded', () => {
      if (!loadSaved()) showWelcome();
      updateCount()
    });
    window.addEventListener('beforeunload', (event) => {
      if (hasUnsavedChanges && chatHistory.length) {
        event.preventDefault();
        event.returnValue = '';
      }
    });
  </script>
</body>
