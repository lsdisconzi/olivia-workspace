<!-- Scene 2/13 — scene-pencil (Lápis — Educação) — extracted from _lsd/morphs/index-br.html -->
<svg viewBox="0 0 280 260" xmlns="http://www.w3.org/2000/svg">
  <style>
@keyframes sway {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(1.2deg); }
}
@keyframes fruit-glow {
  0%, 100% { opacity: 0.85; }
  50% { opacity: 1; }
}
  </style>
  <g style="transform-origin: 140px 130px; animation: sway 10s ease-in-out infinite">
              <!-- Pencil body - curved like the branch -->
              <path d="M95 220 
                       Q100 190, 110 165 
                       Q125 130, 145 105 
                       Q165 80, 190 60 
                       Q210 45, 225 38" 
                    fill="none" 
                    stroke="#2d785a" 
                    stroke-width="3.5" 
                    stroke-linecap="round"
                    opacity="0.65"/>
            
              <!-- Pencil tip (point) -->
              <path d="M225 38 L240 28 L232 42 Z" fill="#1c4532" opacity="0.7"/>
              <path d="M232 35 L240 28" stroke="#1a1814" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
            
              <!-- Pencil wood grain lines -->
              <path d="M98 215 Q103 188, 112 162" fill="none" stroke="#1c4532" stroke-width="0.5" opacity="0.2" stroke-linecap="round"/>
              <path d="M92 218 Q98 192, 108 168" fill="none" stroke="#1c4532" stroke-width="0.5" opacity="0.15" stroke-linecap="round"/>
            
              <!-- Eraser end -->
              <ellipse cx="92" cy="222" rx="8" ry="6" fill="#c4622d" opacity="0.85" transform="rotate(55 92 222)"/>
              <ellipse cx="91" cy="220" rx="3" ry="2" fill="#d4733e" opacity="0.4" transform="rotate(55 91 220)"/>
            
              <!-- Metal ferrule -->
              <path d="M96 214 Q100 208, 104 204" fill="none" stroke="#9a9088" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
            
              <!-- Writing marks / leaves becoming strokes -->
              <g opacity="0.4">
                <path d="M180 72 Q175 80, 168 85" fill="none" stroke="#1c4532" stroke-width="1" stroke-linecap="round"/>
                <path d="M160 92 Q152 98, 148 106" fill="none" stroke="#1c4532" stroke-width="0.8" stroke-linecap="round"/>
                <path d="M135 118 Q128 126, 124 132" fill="none" stroke="#1c4532" stroke-width="0.6" stroke-linecap="round"/>
              </g>
            
              <!-- Knowledge fruits - smaller, like ink drops -->
              <ellipse cx="175" cy="78" rx="4" ry="5" fill="#c4622d" opacity="0.7" style="animation: fruit-glow 4s ease-in-out infinite"/>
              <ellipse cx="148" cy="108" rx="3.5" ry="4.5" fill="#c4622d" opacity="0.6" style="animation: fruit-glow 4s ease-in-out 0.6s infinite"/>
            </g>
</svg>
