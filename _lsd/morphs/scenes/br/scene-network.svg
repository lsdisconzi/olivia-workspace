<!-- Scene 5/13 — scene-network (Rede — Inteligência) — extracted from _lsd/morphs/index-br.html -->
<svg viewBox="0 0 280 260" xmlns="http://www.w3.org/2000/svg">
  <style>
@keyframes fruit-glow {
  0%, 100% { opacity: 0.85; }
  50% { opacity: 1; }
}
@keyframes subtle-pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.6; }
}
  </style>
  <g style="transform-origin: 140px 130px;">
              <!-- Central trunk becoming a graph stem -->
              <path d="M140 240 Q140 200, 140 160 Q140 140, 140 130" fill="none" stroke="#1c4532" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

              <!-- Hub node -->
              <circle cx="140" cy="120" r="12" fill="none" stroke="#2d785a" stroke-width="2" opacity="0.5"/>
              <ellipse cx="140" cy="120" rx="6" ry="7" fill="#c4622d" opacity="0.85" style="animation: fruit-glow 4s ease-in-out infinite"/>

              <!-- Branch edges radiating out -->
              <path d="M140 120 Q120 100, 80 75" fill="none" stroke="#2d785a" stroke-width="1.2" stroke-linecap="round" opacity="0.4" style="animation: subtle-pulse 5s ease-in-out infinite"/>
              <path d="M140 120 Q160 100, 200 75" fill="none" stroke="#2d785a" stroke-width="1.2" stroke-linecap="round" opacity="0.4" style="animation: subtle-pulse 5s ease-in-out 0.5s infinite"/>
              <path d="M140 120 Q100 125, 60 140" fill="none" stroke="#2d785a" stroke-width="1.2" stroke-linecap="round" opacity="0.35" style="animation: subtle-pulse 5s ease-in-out 1s infinite"/>
              <path d="M140 120 Q180 125, 220 140" fill="none" stroke="#2d785a" stroke-width="1.2" stroke-linecap="round" opacity="0.35" style="animation: subtle-pulse 5s ease-in-out 1.5s infinite"/>
              <path d="M140 120 Q120 90, 105 55" fill="none" stroke="#2d785a" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
              <path d="M140 120 Q160 90, 175 55" fill="none" stroke="#2d785a" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

              <!-- Leaf nodes — olives as knowledge points -->
              <circle cx="80" cy="75" r="8" fill="none" stroke="#2d785a" stroke-width="1.2" opacity="0.4"/>
              <ellipse cx="80" cy="75" rx="4" ry="5" fill="#c4622d" opacity="0.75" style="animation: fruit-glow 4s ease-in-out 0.3s infinite"/>

              <circle cx="200" cy="75" r="8" fill="none" stroke="#2d785a" stroke-width="1.2" opacity="0.4"/>
              <ellipse cx="200" cy="75" rx="4" ry="5" fill="#c4622d" opacity="0.75" style="animation: fruit-glow 4s ease-in-out 0.6s infinite"/>

              <circle cx="60" cy="140" r="7" fill="none" stroke="#2d785a" stroke-width="1" opacity="0.35"/>
              <ellipse cx="60" cy="140" rx="3.5" ry="4.5" fill="#c4622d" opacity="0.65" style="animation: fruit-glow 4s ease-in-out 0.9s infinite"/>

              <circle cx="220" cy="140" r="7" fill="none" stroke="#2d785a" stroke-width="1" opacity="0.35"/>
              <ellipse cx="220" cy="140" rx="3.5" ry="4.5" fill="#c4622d" opacity="0.65" style="animation: fruit-glow 4s ease-in-out 1.2s infinite"/>

              <circle cx="105" cy="55" r="6" fill="none" stroke="#2d785a" stroke-width="1" opacity="0.3"/>
              <ellipse cx="105" cy="55" rx="3" ry="4" fill="#c4622d" opacity="0.6"/>

              <circle cx="175" cy="55" r="6" fill="none" stroke="#2d785a" stroke-width="1" opacity="0.3"/>
              <ellipse cx="175" cy="55" rx="3" ry="4" fill="#c4622d" opacity="0.6"/>

              <!-- Secondary edges (sub-connections) -->
              <path d="M80 75 Q70 60, 105 55" fill="none" stroke="#2d785a" stroke-width="0.6" stroke-linecap="round" opacity="0.2"/>
              <path d="M200 75 Q190 60, 175 55" fill="none" stroke="#2d785a" stroke-width="0.6" stroke-linecap="round" opacity="0.2"/>
              <path d="M60 140 Q50 110, 80 75" fill="none" stroke="#2d785a" stroke-width="0.6" stroke-linecap="round" opacity="0.2"/>
              <path d="M220 140 Q230 110, 200 75" fill="none" stroke="#2d785a" stroke-width="0.6" stroke-linecap="round" opacity="0.2"/>

              <!-- Root lines -->
              <path d="M120 244 Q140 250, 160 244" fill="none" stroke="#1c4532" stroke-width="1" opacity="0.15" stroke-linecap="round"/>
            </g>
</svg>
