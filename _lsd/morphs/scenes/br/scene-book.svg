                <path d="M158 123 L198 125" fill="none" stroke="#2d785a" stroke-width="0.8" stroke-linecap="round"/>
                <path d="M160 138 L196 140" fill="none" stroke="#2d785a" stroke-width="0.8" stroke-linecap="round"/>
                <path d="M162 153 L194 155" fill="none" stroke="#2d785a" stroke-width="0.6" stroke-linecap="round"/>
                <path d="M164 168 L192 170" fill="none" stroke="#2d785a" stroke-width="0.6" stroke-linecap="round"/>
              </g>

              <!-- Olives as bookmarks / knowledge fruits -->
              <ellipse cx="140" cy="82" rx="5.5" ry="7" fill="#c4622d" opacity="0.9" style="animation: fruit-glow 4s ease-in-out infinite"/>
              <ellipse cx="139" cy="80" rx="2.2" ry="2.8" fill="#d4733e" opacity="0.4"/>

              <ellipse cx="95" cy="195" rx="3.5" ry="4.5" fill="#c4622d" opacity="0.65" style="animation: fruit-glow 4s ease-in-out 0.5s infinite"/>
              <ellipse cx="185" cy="195" rx="3.5" ry="4.5" fill="#c4622d" opacity="0.65" style="animation: fruit-glow 4s ease-in-out 1s infinite"/>

              <!-- Small leaf flourishes -->
              <path d="M130 85 Q122 78, 118 72" fill="none" stroke="#1c4532" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
              <path d="M150 85 Q158 78, 162 72" fill="none" stroke="#1c4532" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>

