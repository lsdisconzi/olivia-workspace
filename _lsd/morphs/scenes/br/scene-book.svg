              <path d="M140 90 Q150 88, 200 85 Q215 84, 222 90 Q225 95, 224 100 L215 220 Q212 228, 200 228 Q170 226, 140 220" fill="none" stroke="#2d785a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

              <!-- Text lines on left page -->
              <g opacity="0.2">
                <path d="M80 110 L125 108" fill="none" stroke="#2d785a" stroke-width="0.8" stroke-linecap="round"/>
                <path d="M82 125 L122 123" fill="none" stroke="#2d785a" stroke-width="0.8" stroke-linecap="round"/>
                <path d="M84 140 L120 138" fill="none" stroke="#2d785a" stroke-width="0.8" stroke-linecap="round"/>
