<!-- Scene 6/13 — scene-book (Livro — Ontologia) — extracted from _lsd/morphs/index-br.html -->
<svg viewBox="0 0 280 260" xmlns="http://www.w3.org/2000/svg">
  <style>
@keyframes sway {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(1.2deg); }
}
@keyframes fruit-glow {
  0%, 100% { opacity: 0.85; }
  50% { opacity: 1; }
}
  </style>
  <g style="transform-origin: 140px 130px; animation: sway 10s ease-in-out infinite">
              <!-- Spine / trunk of the book -->
              <path d="M140 235 Q140 200, 140 165 Q140 130, 140 90" fill="none" stroke="#1c4532" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>

