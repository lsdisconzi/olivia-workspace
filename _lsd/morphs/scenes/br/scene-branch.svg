<!-- Scene 1/13 — scene-branch (Ramo de oliveira — Origem) — extracted from _lsd/morphs/index-br.html -->
<svg viewBox="0 0 280 260" xmlns="http://www.w3.org/2000/svg">
  <style>
@keyframes sway {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(1.2deg); }
}
@keyframes sway-r {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-1deg); }
}
@keyframes fruit-glow {
  0%, 100% { opacity: 0.85; }
  50% { opacity: 1; }
}
  </style>
  <g style="transform-origin: 140px 130px;">
              <!-- Main curved branch - ascending growth curve -->
              <path d="M95 220 
                       Q100 190, 110 165 
                       Q125 130, 145 105 
                       Q165 80, 190 60 
                       Q210 45, 225 38" 
                    fill="none" 
                    stroke="#2d785a" 
                    stroke-width="2.2" 
                    stroke-linecap="round"
                    opacity="0.7"
                    style="animation: sway 8s ease-in-out infinite"/>
            
              <!-- Small branches/leaves hints -->
              <g style="animation: sway-r 6s ease-in-out 0.3s infinite; transform-origin: 118px 155px;">
                <path d="M118 158 Q108 148, 100 142" fill="none" stroke="#2d785a" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
              </g>
              <g style="animation: sway 5.5s ease-in-out 0.5s infinite; transform-origin: 155px 95px;">
                <path d="M155 98 Q148 88, 142 82" fill="none" stroke="#2d785a" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
              </g>
            
              <!-- Olive fruits along the curve -->
              <ellipse cx="120" cy="160" rx="5" ry="6.5" fill="#c4622d" opacity="0.9" transform="rotate(-15 120 160)" style="animation: fruit-glow 4s ease-in-out infinite"/>
              <ellipse cx="119" cy="158" rx="2" ry="2.5" fill="#d4733e" opacity="0.4" transform="rotate(-15 119 158)"/>
            
              <ellipse cx="155" cy="100" rx="5.5" ry="7" fill="#c4622d" opacity="0.9" transform="rotate(-25 155 100)" style="animation: fruit-glow 4s ease-in-out 0.5s infinite"/>
              <ellipse cx="154" cy="98" rx="2.2" ry="2.8" fill="#d4733e" opacity="0.4" transform="rotate(-25 154 98)"/>
            
              <ellipse cx="200" cy="52" rx="6" ry="7.5" fill="#c4622d" opacity="0.9" transform="rotate(-35 200 52)" style="animation: fruit-glow 4s ease-in-out 1s infinite"/>
              <ellipse cx="199" cy="50" rx="2.4" ry="3" fill="#d4733e" opacity="0.4" transform="rotate(-35 199 50)"/>
            </g>
</svg>
