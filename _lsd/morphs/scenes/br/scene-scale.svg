<!-- Scene 3/13 — scene-scale (Balança — Direito) — extracted from _lsd/morphs/index-br.html -->
<svg viewBox="0 0 280 260" xmlns="http://www.w3.org/2000/svg">
  <style>
@keyframes fruit-glow {
  0%, 100% { opacity: 0.85; }
  50% { opacity: 1; }
}
@keyframes scale-balance {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(2deg); }
  75% { transform: rotate(-2deg); }
}
  </style>
  <g style="transform-origin: 140px 130px;">
              <!-- Central pillar / trunk -->
              <path d="M140 230 Q140 180, 140 130 Q140 100, 140 75" 
                    fill="none" 
                    stroke="#2d785a" 
                    stroke-width="3" 
                    stroke-linecap="round"
                    opacity="0.6"/>
            
              <!-- Balance beam -->
              <g style="animation: scale-balance 6s ease-in-out infinite; transform-origin: 140px 75px;">
                <path d="M60 85 Q100 72, 140 75 Q180 72, 220 85" 
                      fill="none" 
                      stroke="#2d785a" 
                      stroke-width="2" 
                      stroke-linecap="round"
                      opacity="0.55"/>
              
                <!-- Left pan strings -->
                <path d="M70 88 L70 120" fill="none" stroke="#2d785a" stroke-width="1" opacity="0.4"/>
                <path d="M60 85 L55 118" fill="none" stroke="#2d785a" stroke-width="1" opacity="0.35"/>
              
                <!-- Left pan -->
                <ellipse cx="62" cy="125" rx="22" ry="6" fill="none" stroke="#2d785a" stroke-width="1.2" opacity="0.45"/>
              
                <!-- Right pan strings -->
                <path d="M210 88 L210 120" fill="none" stroke="#2d785a" stroke-width="1" opacity="0.4"/>
                <path d="M220 85 L225 118" fill="none" stroke="#2d785a" stroke-width="1" opacity="0.35"/>
              
                <!-- Right pan -->
                <ellipse cx="218" cy="125" rx="22" ry="6" fill="none" stroke="#2d785a" stroke-width="1.2" opacity="0.45"/>
              
                <!-- Olives on scales - representing balanced judgment -->
                <ellipse cx="55" cy="118" rx="5" ry="6" fill="#c4622d" opacity="0.85" style="animation: fruit-glow 4s ease-in-out infinite"/>
                <ellipse cx="70" cy="116" rx="4.5" ry="5.5" fill="#c4622d" opacity="0.75" style="animation: fruit-glow 4s ease-in-out 0.3s infinite"/>
              
                <ellipse cx="218" cy="117" rx="5" ry="6" fill="#c4622d" opacity="0.85" style="animation: fruit-glow 4s ease-in-out 0.6s infinite"/>
                <ellipse cx="232" cy="118" rx="4" ry="5" fill="#c4622d" opacity="0.7" style="animation: fruit-glow 4s ease-in-out 0.9s infinite"/>
              </g>
            
              <!-- Top olive - crown of justice -->
              <ellipse cx="140" cy="65" rx="6" ry="7.5" fill="#c4622d" opacity="0.9" style="animation: fruit-glow 4s ease-in-out 0.5s infinite"/>
              <ellipse cx="139" cy="63" rx="2.4" ry="3" fill="#d4733e" opacity="0.4"/>
            
              <!-- Subtle leaf decorations -->
              <path d="M132 70 Q125 62, 120 58" fill="none" stroke="#2d785a" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
              <path d="M148 70 Q155 62, 160 58" fill="none" stroke="#2d785a" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
            
              <!-- Base -->
              <path d="M115 232 Q140 238, 165 232" fill="none" stroke="#2d785a" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
            </g>
</svg>
