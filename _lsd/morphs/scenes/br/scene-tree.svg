<!-- Scene 4/13 — scene-tree (Oliveira completa — Ecossistema) — extracted from _lsd/morphs/index-br.html -->
<svg viewBox="0 0 280 260" xmlns="http://www.w3.org/2000/svg">
  <style>
@keyframes sway {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(1.2deg); }
}
@keyframes sway-r {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-1deg); }
}
@keyframes fruit-glow {
  0%, 100% { opacity: 0.85; }
  50% { opacity: 1; }
}
@keyframes leaf-rustle {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(3deg) scale(1.02); }
}
  </style>
  <g style="transform-origin: 140px 150px;">
