                    style="animation: sway 9s ease-in-out infinite"/>
            
              <!-- Ground line -->
              <path d="M100 248 Q140 254, 180 248" fill="none" stroke="#1c4532" stroke-width="1" opacity="0.15" stroke-linecap="round"/>
            
              <!-- Main branches -->
